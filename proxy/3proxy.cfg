# ============================================
# 3proxy — Configuration
# ============================================
# 50 proxy ports (3001-3050) with authentication
# Each port maps to a different router/outgoing IP

# Daemon mode
daemon

# DNS
nscache 65536
nserver 8.8.8.8
nserver 1.1.1.1

# Timeouts
timeouts 1 5 30 60 180 1800 15 60

# Logging
log /var/log/3proxy/3proxy.log D
logformat "L%d-%m-%Y %H:%M:%S %N.%p %E %C:%c %R:%r %O %I %h %T"
rotate 30

# Auth users file
users $/etc/3proxy/users.txt

# Global settings
maxconn 1000

# Auth type: strong (login required)
auth strong

# Connection limits per port: max 20 simultaneous connections
# M-04: Restrict destination ports — web traffic only
allow * * * 80,443,8080,8443
deny * * * *

# ── Port 3001-3050 proxy instances ──
# Each proxy binds to its port. In production, set parent/external
# to route through the corresponding router.
# For now, we use simple HTTP proxy on each port.

# Format: proxy -p<port> -e<external_ip>
# When routers are configured as gateways, use:
#   parent 1000 http <router_ip> 8080

flush

# Port 3001
connlim 8 20
proxy -n -p3001

# Port 3002
connlim 8 20
proxy -n -p3002

# Port 3003
connlim 8 20
proxy -n -p3003

