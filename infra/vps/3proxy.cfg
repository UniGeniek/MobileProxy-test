# ============================================
# 3proxy — VPS Production Config
# Proxies on VPS forward through WireGuard to local node
# Each port maps to a specific modem via tunnel
# ============================================

daemon
pidfile /var/run/3proxy.pid

# DNS
nscache 65536
nserver 8.8.8.8
nserver 1.1.1.1

# Timeouts: connect idle response dns lifetime keepalive clients minlevel
timeouts 1 5 30 60 180 1800 15 60

# Logging
log /var/log/3proxy/3proxy.log D
logformat "L%d-%m-%Y %H:%M:%S %N.%p %E %C:%c %R:%r %O %I %h %T"
rotate 30

# Auth users
users $/etc/3proxy/users.txt

# Global limits
maxconn 2000

# Auth
auth strong

# M-04: Restrict destination ports — web traffic only
# Block access to internal services (Redis 6379, PG 5432, SSH 22, etc.)
allow * * * 80,443,8080,8443
deny * * * *

flush

# ── Port 3001-3020: each forwards to local node via WireGuard ──
# 3proxy on VPS binds each port.
# Traffic goes: client → VPS:300X → WG tunnel → local node.
# On local node, iptables marks by dest port → routes to correct modem.
#
# The -e flag binds the OUTGOING interface to the WireGuard peer.
# Since all traffic exits via 10.66.66.2 (local node), we use
# "parent" to chain through the tunnel as a SOCKS/connect gateway,
# OR we use iptables DNAT on VPS to forward port to local node.
#
# Simplest approach: DNAT on VPS + 3proxy on local node.
# But for auth on VPS side, we run 3proxy here and use "parent".

# Method: 3proxy on VPS with "parent" pointing to local node SOCKS
# Local node runs a SOCKS5 per modem (or we use iptables DNAT).
#
# CLEAN METHOD: VPS 3proxy → iptables DNAT → tunnel → local routing
# This means 3proxy on VPS handles auth, then OS routes to tunnel.

connlim 20 20
proxy -n -p3001 -e10.66.66.2

connlim 20 20
proxy -n -p3002 -e10.66.66.2

connlim 20 20
proxy -n -p3003 -e10.66.66.2

connlim 20 20
proxy -n -p3004 -e10.66.66.2

connlim 20 20
proxy -n -p3005 -e10.66.66.2

connlim 20 20
proxy -n -p3006 -e10.66.66.2

connlim 20 20
proxy -n -p3007 -e10.66.66.2

connlim 20 20
proxy -n -p3008 -e10.66.66.2

connlim 20 20
proxy -n -p3009 -e10.66.66.2

connlim 20 20
